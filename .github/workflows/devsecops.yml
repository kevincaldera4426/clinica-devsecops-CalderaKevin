name: DevSecOps

on: [push, pull_request]

permissions:
  contents: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SAST con Semgrep
        run: >
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep
          semgrep scan --config .semgrep/sql.yml --error

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolver dependencias
        run: npm install --package-lock-only

      - name: Generar SBOM con Trivy
        run: >
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest
          fs --format cyclonedx --output /src/sbom.json /src

      - name: Guardar SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Gate de dependencias
        run: npm audit --audit-level=high
